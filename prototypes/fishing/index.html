<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#223d2c">
<title>Fishing at Smoke Lake — Abundant Waters</title>
<style>
  :root { --ink:#1c2a2e; --paper:#f1ebdd; --paper2:#e2d8c2; --pine:#223d2c; --lake:#2d6a80; --clay:#c0452b; --amber:#c9851f; font-family:"Atkinson Hyperlegible",system-ui,sans-serif; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html,body { width:100%; height:100%; margin:0; overflow:hidden; }
  body { background:var(--pine); color:var(--paper); }
  button { font:inherit; cursor:pointer; touch-action:manipulation; }
  button:focus-visible,canvas:focus-visible { outline:3px solid #edb35d; outline-offset:3px; }
  #app { position:relative; width:100%; height:100%; height:100dvh; min-height:300px; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; touch-action:none; cursor:crosshair; }
  .top { position:absolute; top:0; left:0; right:0; z-index:2; display:flex; align-items:center; gap:12px; min-height:61px; padding:max(9px,env(safe-area-inset-top)) max(15px,env(safe-area-inset-right)) 9px max(15px,env(safe-area-inset-left)); background:#1a3029d9; backdrop-filter:blur(5px); }
  .title { font:700 clamp(18px,2vw,23px)/1.1 Georgia,serif; white-space:nowrap; }
  .title small { display:block; margin-top:3px; color:#dccaaa; font:700 10px/1.2 "Atkinson Hyperlegible",system-ui,sans-serif; letter-spacing:.12em; text-transform:uppercase; }
  .right { margin-left:auto; display:flex; align-items:center; gap:12px; }
  .count { color:#eadcc3; font-size:13px; white-space:nowrap; }
  .quiet-btn { min-height:42px; padding:6px 12px; border:1px solid #e8ddc399; border-radius:5px; background:#233f32; color:var(--paper); font-weight:700; }
  .hud { position:absolute; z-index:2; left:max(12px,env(safe-area-inset-left)); top:calc(max(9px,env(safe-area-inset-top)) + 68px); max-width:min(390px,calc(100% - 24px)); padding:9px 12px; background:#f1ebdde8; color:#243c34; border-left:3px solid #b6603e; box-shadow:0 3px 12px #102b2b33; font-size:14px; }
  .hud b { display:block; font:700 17px Georgia,serif; }
  .hud span { display:block; margin-top:2px; }
  .bottom { position:absolute; z-index:3; bottom:0; left:0; right:0; display:flex; flex-direction:column; align-items:center; gap:8px; padding:10px max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left)); background:linear-gradient(transparent,#152c2ee8 17%,#152c2ef5); }
  .feedback { width:min(640px,100%); min-height:32px; text-align:center; font-size:15px; font-weight:650; text-shadow:0 1px 3px #0c1d24; }
  .tension { width:min(440px,100%); }
  .tension-head { display:flex; justify-content:space-between; gap:10px; font-size:12px; font-weight:750; }
  .track { height:13px; margin:4px 0; border:1px solid #dccfb4; border-radius:2px; background:linear-gradient(90deg,#c39970 0 21%,#7b9e7c 21% 74%,#ca885f 74%); }
  .needle { position:relative; left:calc(var(--tension,42) * 1%); width:3px; height:19px; margin-top:-4px; background:#fff8e7; box-shadow:0 1px 3px #102a2b; transition:left .08s linear; }
  .progress { height:5px; margin-top:6px; background:#ebe2c64d; }
  .progress div { height:100%; width:var(--progress,0%); background:#e8c68e; }
  .reel { width:min(360px,100%); min-height:62px; padding:10px 20px; border:2px solid #eed6a6; border-radius:7px; background:#ba5c38; color:#fff8ed; font-weight:850; letter-spacing:.02em; box-shadow:0 5px 0 #623829,0 7px 15px #0b242a99; }
  .reel:active,.reel.active { transform:translateY(4px); box-shadow:0 1px 0 #623829,0 3px 8px #0b242a99; }
  .fight-actions { display:flex; justify-content:center; gap:9px; width:min(470px,100%); }
  .fight-actions .reel { flex:1; width:auto; }
  .give { min-width:116px; min-height:62px; padding:8px 13px; border:2px solid #e3d8bd; border-radius:7px; background:#e8dfc9; color:#253e34; font-weight:800; box-shadow:0 5px 0 #8d8a77,0 7px 15px #0b242a99; }
  .give:active,.give.active { transform:translateY(4px); box-shadow:0 1px 0 #8d8a77,0 3px 8px #0b242a99; }
  .guide { font-size:12px; color:#f1e7d3; text-align:center; }
  .result { position:absolute; z-index:4; top:50%; left:50%; width:min(440px,calc(100% - 28px)); transform:translate(-50%,-50%); padding:25px; border:1px solid #d5c39e; background:#f4eedf; color:var(--ink); box-shadow:0 20px 55px #10242dbb; }
  .result p { margin:6px 0 18px; }
  .result h2 { margin:0; font:700 clamp(24px,5vw,34px) Georgia,serif; }
  .result button { min-height:50px; padding:9px 16px; border:0; background:#223d2c; color:#fff7e8; font-weight:750; }
  @media(max-width:600px) {
    .top { min-height:53px; padding-top:max(7px,env(safe-area-inset-top)); padding-bottom:6px; }
    .title { font-size:18px; }
    .title small { font-size:9px; }
    .right { gap:7px; }
    .count { font-size:11px; }
    .quiet-btn { min-height:42px; padding:5px 8px; font-size:12px; }
    .hud { top:calc(max(7px,env(safe-area-inset-top)) + 56px); max-width:min(260px,calc(100% - 24px)); font-size:12px; padding:7px 9px; }
    .hud b { font-size:15px; }
    .feedback { font-size:14px; }
    .reel { min-height:62px; }
  }
  @media(max-height:520px) and (orientation:landscape) {
    .hud { max-width:220px; }
    .bottom { right:0; left:auto; width:min(320px,45%); background:#152c2ee8; }
    .reel,.give { min-height:48px; }
    .guide { display:none; }
  }
</style>
<link rel="stylesheet" href="../immersive.css">
</head>
<body>
<div id="app">
  <canvas id="water" tabindex="0" aria-label="Smoke Lake fishing water. Touch to aim and cast near granite or reeds. Retrieve steadily, set the hook on a tug, and manage line tension. Arrow keys aim; Enter casts."></canvas>
  <div class="top">
    <div class="title">Smoke Lake<small>A quiet cast · free time</small></div>
    <div class="right"><span class="count" id="count">Fish log · 0</span><button class="quiet-btn" type="button" id="reset">New cast</button></div>
  </div>
  <div class="hud"><b id="hudTitle">Read the water</b><span id="hudText">A dark seam runs past the granite. Reeds stir along the other shore.</span></div>
  <div class="bottom">
    <div class="feedback" id="feedback" role="status" aria-live="polite">Cast beside the granite or reeds. Watch the line.</div>
    <div class="tension" id="tension" hidden role="group" aria-label="Line tension and fish distance">
      <div class="tension-head"><span>Line tension</span><span id="tensionLabel">Steady</span></div>
      <div class="track" role="meter" id="meter" aria-label="Line tension" aria-valuemin="0" aria-valuemax="100" aria-valuenow="42"><div class="needle" id="needle"></div></div>
      <div class="progress"><div id="progressFill"></div></div>
      <div class="tension-head"><span>Fish toward shore</span><span id="distanceLabel">0%</span></div>
    </div>
    <div class="fight-actions" id="actions" hidden>
      <button class="reel" type="button" id="reel">Reel the lure</button>
      <button class="give" type="button" id="give" hidden>Give line</button>
    </div>
    <span class="guide" id="guide">Touch the water to aim and cast · hold Reel to retrieve</span>
  </div>
  <div class="result" id="result" hidden aria-live="polite">
    <h2 id="resultTitle"></h2><p id="resultText"></p><button id="again" type="button">Try another cast</button>
  </div>
</div>
<script>
(() => {
  const canvas=document.getElementById("water"),ctx=canvas.getContext("2d");
  const status=document.getElementById("feedback"),hudTitle=document.getElementById("hudTitle"),hudText=document.getElementById("hudText");
  const reel=document.getElementById("reel"),give=document.getElementById("give"),actions=document.getElementById("actions"),reset=document.getElementById("reset"),guide=document.getElementById("guide");
  const tensionUI=document.getElementById("tension"),meter=document.getElementById("meter"),needle=document.getElementById("needle");
  const progressFill=document.getElementById("progressFill"),distanceLabel=document.getElementById("distanceLabel"),tensionLabel=document.getElementById("tensionLabel");
  const result=document.getElementById("result");
  const source={x:.17,y:.78},bass={x:.54,y:.47},pike={x:.81,y:.52};
  let w=0,h=0,dpr=1,clock=0,last=0,paused=false,phase="aim",aim={x:.57,y:.53},lure={...aim};
  let landing={...aim},targetFish=null,retrieve=0,castFlight=0,pressing=false,giving=false,pressStart=0,burst=0;
  let tension=.42,progress=0,surge=0,slackTime=0,catches=0,failedAt=0,castNumber=0,dragging=false;
  let biteAge=0,biteRequiresRelease=false,ignoreClick=false,snagged=false;
  const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function resize(){
    const r=canvas.getBoundingClientRect();w=r.width;h=r.height;dpr=Math.min(2,devicePixelRatio||1);
    canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  new ResizeObserver(resize).observe(canvas);resize();
  function setStatus(text){if(status.textContent!==text)status.textContent=text;}
  function message(text,title,detail){
    setStatus(text);
    if(title)hudTitle.textContent=title;
    if(detail)hudText.textContent=detail;
  }
  function ui(){
    const hasLine=["retrieve","bite","fight","snag"].includes(phase);
    actions.hidden=!hasLine;give.hidden=phase!=="fight"&&phase!=="snag";give.textContent=phase==="snag"?"Ease the line":"Give line";tensionUI.hidden=phase!=="fight";
    guide.hidden=hasLine||phase==="caught";
    reset.hidden=phase==="caught";
    needle.style.setProperty("--tension",Math.round(tension*100));
    meter.setAttribute("aria-valuenow",String(Math.round(tension*100)));
    progressFill.style.setProperty("--progress",Math.round(progress*100)+"%");
    distanceLabel.textContent=Math.round(progress*100)+"%";
    tensionLabel.textContent=tension<.24?"Slack — reel":tension>.77?"Hard pull — release":"Steady";
    const reelLabel=phase==="bite"?"Set the hook":phase==="fight"?"Reel in":phase==="snag"?"Line caught":"Reel the lure";reel.disabled=phase==="snag";
    if(reel.textContent!==reelLabel)reel.textContent=reelLabel;
  }
  function stopReel(){pressing=false;reel.classList.remove("active");}
  function stopGive(){giving=false;give.classList.remove("active");}
  function ready(text="Touch the lake to cast. Aim beside the granite or reeds."){
    stopReel();stopGive();phase="aim";targetFish=null;retrieve=0;progress=0;tension=.42;slackTime=0;burst=0;biteAge=0;biteRequiresRelease=false;ignoreClick=false;snagged=false;
    result.hidden=true;message(text,"Read the water","A dark seam runs past the granite. Reeds stir along the other shore.");ui();
  }
  function fishAt(kind){
    const home=kind==="bass"?bass:pike;
    return {x:home.x+Math.sin(clock*(kind==="bass"?.55:.38)+(kind==="bass"?0:2))*.043,
      y:home.y+Math.cos(clock*(kind==="bass"?.72:.6)+(kind==="bass"?0:1))*.022};
  }
  function coverAt(x,y){
    return x>.27&&x<.46&&y>.31&&y<.45 || x>.72&&x<.94&&y>.32&&y<.45;
  }
  function castAt(x,y){
    if(phase!=="aim")return;
    aim={x,y};landing={x:Math.max(.22,Math.min(.97,x)),y:Math.max(.24,Math.min(.76,y))};
    lure={...source};castFlight=0;retrieve=0;castNumber++;phase="flight";
    snagged=coverAt(landing.x,landing.y);
    message("The lure sails over Smoke Lake…","Read the water","Watch where it touches down, then work it along the edge.");ui();
  }
  function bite(kind){
    phase="bite";targetFish=kind;biteAge=0;biteRequiresRelease=pressing;pressing=false;burst=0;
    message("A quick tug travels up the line.","A fish is taking it","Set the hook on the next pull.");ui();
  }
  function hook(){
    if(phase!=="bite")return;
    if(biteAge<.18){lost("early");return;}
    if(biteAge>1.35){lost("missed");return;}
    phase="fight";tension=.42;progress=0;slackTime=0;surge=0;
    message("The rod bends. Keep a steady line.","Fish on","Reel when it gives, ease off when it runs.");ui();
  }
  function lost(kind){
    phase="lost";failedAt=clock;stopReel();stopGive();ui();
    const texts={snap:"The line snaps under a hard pull.",slack:"Slack line gives the fish a way out.",
      early:"The lure slips away before the fish has it.",missed:"The tug fades and the fish lets go."};
    message(texts[kind]||texts.missed,"One got away","The lake is still here for another cast.");
  }
  function landed(){
    phase="caught";stopReel();stopGive();catches++;
    const name=targetFish==="pike"?"Northern pike":"Smallmouth bass";
    document.getElementById("count").textContent="Fish log · "+catches;
    document.getElementById("resultTitle").textContent=name+"!";
    document.getElementById("resultText").textContent=targetFish==="pike"?
      "It came out of the weeds like a green arrow. Dad keeps it low and uses pliers to free the hook.":
      "It darted along the granite edge and gave one last jump. Dad grins as you bring it alongside.";
    result.hidden=false;
    message("You brought it in.","A fish for the trip log","The water settles around the canoe.");
    window.parent.postMessage({type:"abundant-waters:fish-landed",fish:name},location.origin);
    window.AbundantWaters.complete();
    ui();
  }
  function point(e){
    const r=canvas.getBoundingClientRect();
    return {x:Math.max(.02,Math.min(.98,(e.clientX-r.left)/r.width)),y:Math.max(.12,Math.min(.9,(e.clientY-r.top)/r.height))};
  }
  canvas.addEventListener("pointerdown",e=>{
    if(phase!=="aim")return;dragging=true;canvas.setPointerCapture(e.pointerId);aim=point(e);
  });
  canvas.addEventListener("pointermove",e=>{if(dragging&&phase==="aim")aim=point(e);});
  canvas.addEventListener("pointerup",e=>{if(!dragging)return;dragging=false;castAt(point(e).x,point(e).y);});
  canvas.addEventListener("pointercancel",()=>{dragging=false;});
  canvas.addEventListener("keydown",e=>{
    if(phase!=="aim")return;
    const step=e.shiftKey?.045:.025;
    if(e.key==="ArrowLeft")aim.x=Math.max(.24,aim.x-step);
    else if(e.key==="ArrowRight")aim.x=Math.min(.96,aim.x+step);
    else if(e.key==="ArrowUp")aim.y=Math.max(.22,aim.y-step);
    else if(e.key==="ArrowDown")aim.y=Math.min(.75,aim.y+step);
    else if(e.key==="Enter"||e.key===" "){e.preventDefault();castAt(aim.x,aim.y);return;}
    else return;
    e.preventDefault();
  });
  reel.addEventListener("pointerdown",e=>{
    if(phase==="bite"){
      if(biteRequiresRelease)return;
      ignoreClick=true;hook();return;
    }
    if(phase!=="retrieve"&&phase!=="fight")return;
    reel.setPointerCapture(e.pointerId);pressStart=performance.now();pressing=true;reel.classList.add("active");
  });
  reel.addEventListener("pointerup",()=>{if(biteRequiresRelease){biteRequiresRelease=false;ignoreClick=true;}stopReel();});
  reel.addEventListener("pointercancel",stopReel);
  reel.addEventListener("lostpointercapture",stopReel);
  reel.addEventListener("click",e=>{
    if(ignoreClick&&e.detail!==0){ignoreClick=false;return;}
    if(phase==="bite"){hook();return;}
    if(e.detail!==0 && performance.now()-pressStart>=700)return;
    if(phase==="retrieve"){
      retrieve=Math.min(1,retrieve+.09);
      lure.x=landing.x+(source.x-landing.x)*retrieve;
      lure.y=landing.y+(source.y-landing.y)*retrieve;
      if(retrieve>=.96)ready("The lure comes back without a strike. Try along the rocky drop or weed edge.");
      else message("The lure darts closer. Watch the edge for a follower.");
    } else if(phase==="fight"){
      tension=Math.min(1,tension+.095);
      if(tension>.97){lost("snap");return;}
      if(tension>.18&&tension<.88)progress=Math.min(1,progress+.085);
      if(progress>=1){landed();return;}
      setStatus(tension>.77?"Hard pull! Give line before it snaps.":"A short turn of the reel brings it closer.");
      ui();
    }
  });
  give.addEventListener("pointerdown",e=>{
    if(phase==="snag"){freeSnag();return;}
    if(phase!=="fight")return;
    give.setPointerCapture(e.pointerId);giving=true;stopReel();give.classList.add("active");
  });
  give.addEventListener("pointerup",stopGive);
  give.addEventListener("pointercancel",stopGive);
  give.addEventListener("lostpointercapture",stopGive);
  give.addEventListener("click",()=>{
    if(phase==="snag"){freeSnag();return;}
    if(phase!=="fight")return;
    tension=Math.max(.16,tension-.16);
    progress=Math.max(0,progress-.012);
    setStatus("You let the fish run. Take up line when the pull softens.");
    ui();
  });
  function freeSnag(){
    if(phase!=="snag")return;
    phase="retrieve";retrieve=Math.min(.95,retrieve+.11);
    lure.x=landing.x+(source.x-landing.x)*retrieve;lure.y=landing.y+(source.y-landing.y)*retrieve;
    message("A little slack frees the lure.","Off the cover","Bring it along the open edge.");ui();
  }
  window.addEventListener("keydown",e=>{
    if((e.key===" "||e.key.toLowerCase()==="r")&&phase==="bite"&&!e.repeat){e.preventDefault();hook();return;}
    if((e.key===" "||e.key.toLowerCase()==="r")&&(phase==="retrieve"||phase==="fight")){
      e.preventDefault();pressing=true;reel.classList.add("active");
    }
    if(e.key.toLowerCase()==="g"&&phase==="snag"){e.preventDefault();freeSnag();return;}
    if(e.key.toLowerCase()==="g"&&phase==="fight"){e.preventDefault();giving=true;stopReel();give.classList.add("active");}
  });
  window.addEventListener("keyup",e=>{if(e.key===" "||e.key.toLowerCase()==="r")stopReel();if(e.key.toLowerCase()==="g")stopGive();});
  reset.addEventListener("click",()=>ready("Another cast. Put the lure beside the granite drop or the reeds."));
  document.getElementById("again").addEventListener("click",()=>ready("The water is quiet again. Pick another place for the lure."));
  function pause(value){paused=value;if(value){stopReel();stopGive();}last=performance.now();}
  window.addEventListener("abundant-waters:pause",()=>pause(true));
  window.addEventListener("abundant-waters:resume",()=>pause(false));
  document.addEventListener("visibilitychange",()=>pause(document.hidden));
  window.addEventListener("blur",()=>{stopReel();stopGive();});
  function update(dt){
    clock+=dt;
    if(phase==="flight"){
      castFlight=Math.min(1,castFlight+dt*2.15);
      const arc=1-Math.pow(1-castFlight,2);
      lure.x=source.x+(landing.x-source.x)*arc;
      lure.y=source.y+(landing.y-source.y)*arc-Math.sin(castFlight*Math.PI)*.18;
      if(castFlight>=1){
        phase=snagged?"snag":"retrieve";lure={...landing};
        message(snagged?"The lure catches on cover. Ease the line to slip it free.":"It lands with a small ring. Work it slowly past the edge.",
          snagged?"Line caught":"Watch the lure",snagged?"Give it slack, then retrieve along the edge.":"Move it steadily past structure.");ui();
      }
    }
    if(phase==="retrieve"){
      const active=pressing||burst>0;
      if(burst>0)burst=Math.max(0,burst-dt);
      if(active){
        retrieve=Math.min(1,retrieve+dt*.15);
        lure.x=landing.x+(source.x-landing.x)*retrieve;
        lure.y=landing.y+(source.y-landing.y)*retrieve;
        if(retrieve>.1&&retrieve<.85){
          for(const kind of ["bass","pike"]){
            const f=fishAt(kind),distance=Math.hypot(lure.x-f.x,(lure.y-f.y)*1.4);
            if(distance<.12){bite(kind);return;}
          }
        }
        if(retrieve>=.96){ready("The lure comes back without a strike. Read the water and try another angle.");return;}
      }
    }
    if(phase==="bite"){
      biteAge+=dt;
      lure.x+=Math.sin(clock*18)*.00045;lure.y+=Math.cos(clock*15)*.00035;
      if(biteAge>1.5){lost("missed");return;}
    }
    if(phase==="fight"){
      const active=pressing||burst>0;
      if(burst>0)burst=Math.max(0,burst-dt);
      surge=Math.max(0,Math.sin(clock*2.6+castNumber*2.1)-.55)*.36;
      tension=Math.max(0,Math.min(1,tension+dt*(giving?-.43:active?.29:-.18)+dt*surge));
      if(giving)progress=Math.max(0,progress-dt*.018);
      if(active && tension>.18 && tension<.88)progress=Math.min(1,progress+dt*.22);
      if(!active&&tension<.14)slackTime+=dt;else slackTime=0;
      if(tension>.97){lost("snap");return;}
      if(slackTime>1.25){lost("slack");return;}
      if(progress>=1){landed();return;}
      if(tension>.77)setStatus("Hard pull! Give line before it snaps.");
      else if(tension<.24)setStatus("The line is going slack. Reel gently.");
      else setStatus(active?"You gain a little line. Keep it steady.":"It runs a little. Take up line when the pull softens.");
      ui();
    }
    if(phase==="lost" && clock-failedAt>1.8)ready("The lake is still here. Aim a fresh cast beside the cover.");
  }
  function path(points,fill,stroke,width=1){
    ctx.beginPath();ctx.moveTo(points[0][0]*w,points[0][1]*h);
    for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0]*w,points[i][1]*h);
    if(fill){ctx.closePath();ctx.fillStyle=fill;ctx.fill();}
    if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke();}
  }
  function ellipse(x,y,rx,ry,color){
    ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x*w,y*h,rx*w,ry*h,0,0,Math.PI*2);ctx.fill();
  }
  function ripple(x,y,r,alpha){
    ctx.strokeStyle="rgba(229,238,221,"+alpha+")";ctx.lineWidth=1.5;
    ctx.beginPath();ctx.ellipse(x*w,y*h,r*w,r*h*.48,0,0,Math.PI*2);ctx.stroke();
  }
  function pine(x,y,size){
    ctx.strokeStyle="#243f34";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x*w,y*h);ctx.lineTo(x*w,(y+size*.2)*h);ctx.stroke();
    path([[x,y-size*.4],[x-size*.055,y+size*.09],[x+size*.055,y+size*.09]],"#254537");
    path([[x,y-size*.28],[x-size*.07,y+size*.18],[x+size*.07,y+size*.18]],"#315345");
  }
  function fish(x,y,kind,alpha=.45){
    ctx.save();ctx.translate(x*w,y*h);ctx.rotate(Math.sin(clock*2)*.08);
    const scale=Math.max(18,Math.min(w*.06,42));
    ctx.fillStyle="rgba(23,64,67,"+alpha+")";
    ctx.beginPath();ctx.ellipse(0,0,scale,scale*.32,-.25,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.moveTo(-scale*.83,0);ctx.lineTo(-scale*1.35,-scale*.48);ctx.lineTo(-scale*1.27,scale*.36);ctx.fill();
    ctx.restore();
  }
  function label(x,y,text){
    ctx.font="700 "+(w<420?11:13)+"px system-ui";
    const tw=ctx.measureText(text).width;
    ctx.fillStyle="#1b3a37ce";ctx.fillRect(x*w-5,y*h-15,tw+10,21);
    ctx.fillStyle="#f4ead2";ctx.fillText(text,x*w,y*h);
  }
  function draw(){
    if(!w||!h)return;
    const sky=ctx.createLinearGradient(0,0,0,h*.4);sky.addColorStop(0,"#b8c8b9");sky.addColorStop(1,"#d8d9bc");
    ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);
    path([[0,.29],[.13,.21],[.22,.26],[.33,.2],[.42,.24],[.57,.18],[.68,.23],[.79,.18],[.9,.24],[1,.2],[1,.52],[0,.52]],"#4d6857");
    for(let i=0;i<15;i++)pine(i/14,.33,.12+(i%3)*.02);
    const water=ctx.createLinearGradient(0,h*.28,0,h);water.addColorStop(0,"#77a1a0");water.addColorStop(.6,"#427b87");water.addColorStop(1,"#245268");
    ctx.fillStyle=water;ctx.fillRect(0,h*.32,w,h*.68);
    path([[0,.34],[.09,.35],[.18,.34],[.29,.32],[.37,.31],[.45,.34],[.49,.38],[.47,.41],[.35,.41],[.28,.37],[.16,.38],[0,.4]],"#718577");
    path([[0,.37],[.18,.37],[.3,.34],[.39,.33],[.46,.37],[.49,.41],[.46,.47],[.37,.46],[.29,.42],[.16,.43],[0,.46]],"#a8a493","#d7c8a8",2);
    path([[0,.37],[.18,.37],[.3,.34],[.39,.33],[.46,.37],[.49,.41],[.46,.47],[.37,.46],[.29,.42],[.16,.43],[0,.46]],null,"#c5c0a9",1);
    for(let i=0;i<6;i++)ellipse(.24+i*.044,.38+(i%2)*.027,.022,.008,"#c8bea5");
    path([[1,.3],[.91,.32],[.85,.35],[.79,.34],[.74,.37],[.7,.42],[.75,.42],[.84,.4],[.91,.38],[1,.39]],"#6d866c");
    for(let i=0;i<20;i++){
      const x=.7+i*.015,y=.41+Math.sin(i*2)*.016;
      ctx.strokeStyle=i%3?"#547861":"#9aae7a";ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(x*w,(y+.045)*h);ctx.quadraticCurveTo((x-.012)*w,y*h,(x+(i%2?.009:-.008))*w,(y-.045)*h);ctx.stroke();
    }
    for(let i=0;i<18;i++){
      const y=.39+i*.035,off=Math.sin(i*2.3+clock*.3)*.014;
      ctx.strokeStyle="rgba(215,226,207,"+(.09+(i%4)*.018)+")";ctx.lineWidth=1.4;
      ctx.beginPath();ctx.moveTo((.23+off)*w,y*h);ctx.quadraticCurveTo(.41*w,(y-.014)*h,.61*w,y*h);ctx.stroke();
      ctx.beginPath();ctx.moveTo(.68*w,(y+.018)*h);ctx.lineTo(.93*w,(y+.012)*h);ctx.stroke();
    }
    path([[0,.67],[.08,.65],[.18,.68],[.22,.72],[.26,.82],[.2,1],[0,1]],"#767c70");
    path([[0,.7],[.08,.68],[.18,.71],[.22,.77],[.24,.84],[.17,1],[0,1]],"#a59e88","#d5c3a5",3);
    for(let i=0;i<7;i++)ellipse(.02+i*.03,.75+(i%3)*.04,.022,.007,"#c1b69d");
    // A shallow canoe and the same young camper silhouette used in Storm Day.
    path([[.01,.9],[.13,.9],[.18,.94],[.16,.97],[.025,.97]],"#9f4c32","#e7ae74",3);
    const kidX=.17*w,kidY=.78*h,u=Math.min(1.15,Math.max(.7,w/750));
    ctx.save();ctx.translate(kidX,kidY);ctx.scale(u,u);
    ctx.fillStyle="#263e3a55";ctx.beginPath();ctx.ellipse(0,4,19,6,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="#405846";ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-5,-13);ctx.lineTo(-9,0);ctx.moveTo(5,-13);ctx.lineTo(9,0);ctx.stroke();
    ctx.fillStyle="#be7045";ctx.fillRect(-12,-36,24,27);
    ctx.strokeStyle="#d5b281";ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(12,-30);ctx.lineTo(21,-24);ctx.moveTo(-12,-30);ctx.lineTo(-20,-15);ctx.stroke();
    ctx.fillStyle="#d5b281";ctx.beginPath();ctx.arc(0,-47,10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#cead64";ctx.beginPath();ctx.ellipse(-1,-55,12,5,0,0,Math.PI*2);ctx.fill();ctx.restore();
    ctx.strokeStyle="#a69370";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(source.x*w,source.y*h);ctx.lineTo(.21*w,.48*h);ctx.stroke();
    ctx.strokeStyle="#443c31";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(.21*w,.48*h);ctx.lineTo(.23*w,.46*h);ctx.stroke();
    const bassNow=fishAt("bass"),pikeNow=fishAt("pike");
    fish(bassNow.x,bassNow.y,"bass",.23);
    fish(pikeNow.x,pikeNow.y,"pike",.2);
    ripple(.53,.48,.035+((clock*.12)%1)*.035,.25);
    ripple(.81,.52,.023+((clock*.1)%1)*.035,.2);
    if(phase==="aim"){
      const x=aim.x*w,y=aim.y*h;
      ctx.strokeStyle="#efe8c999";ctx.setLineDash([4,6]);ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(.21*w,.48*h);ctx.lineTo(x,y);ctx.stroke();ctx.setLineDash([]);
      ctx.strokeStyle="#f3deb1";ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,14,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x-22,y);ctx.lineTo(x-12,y);ctx.moveTo(x+12,y);ctx.lineTo(x+22,y);ctx.moveTo(x,y-22);ctx.lineTo(x,y-12);ctx.moveTo(x,y+12);ctx.lineTo(x,y+22);ctx.stroke();
      label(.3,.295,"granite drop");
      label(w<460?.63:.73,.3,"weed edge");
    }
    if(["flight","retrieve","bite","fight","lost","snag"].includes(phase)){
      let lx=lure.x,ly=lure.y;
      if(phase==="fight"){
        lx=landing.x+(source.x-landing.x)*progress*.85+Math.sin(clock*5)*.014;
        ly=landing.y+(source.y-landing.y)*progress*.85+Math.cos(clock*5)*.012;
        fish(lx+.018,ly+.01,targetFish,.66);
        ripple(lx,ly,.02+Math.abs(Math.sin(clock*6))*.03,.45);
      }
      ctx.strokeStyle=phase==="lost"?"#e8d6a18a":"#f4e7c6";ctx.lineWidth=1.4;
      ctx.beginPath();ctx.moveTo(.21*w,.48*h);ctx.quadraticCurveTo((.21+lx)*.5*w,(Math.min(.48,ly)-.045)*h,lx*w,ly*h);ctx.stroke();
      ellipse(lx,ly,.006,.006,phase==="fight"?"#f7d891":"#c45838");
      if(phase==="retrieve")ripple(lx,ly,.014+Math.sin(clock*9)*.005,.65);
      if(phase==="bite"){ripple(lx,ly,.016+Math.abs(Math.sin(clock*15))*.024,.75);fish(lx+.018,ly+.01,targetFish,.55);}
      if(phase==="snag")ripple(lx,ly,.012,.3);
    }
    if(phase==="caught"){
      ripple(.21,.7,.08,.6);
    }
  }
  function frame(now){
    const dt=Math.min(.04,Math.max(0,(now-(last||now))/1000));last=now;
    if(!paused)update(dt);
    draw();requestAnimationFrame(frame);
  }
  ui();requestAnimationFrame(frame);
})();
</script>
