<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Storm Day screen check</title>
<style>body{margin:16px;background:#ddd7c4;color:#263c34;font:14px system-ui}header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}input{width:440px;max-width:90vw}button,select,input{min-height:44px;font:inherit}iframe{display:block;border:0;width:100%;height:100%}#frame{width:375px;height:812px;border:1px solid #263c34;margin:auto}label{display:flex;gap:6px;align-items:center}</style>
<header><label>Viewport<select id="size"><option value="375,812">iPhone · 375 × 812</option><option value="390,844">iPhone · 390 × 844</option><option value="320,568">Small phone · 320 × 568</option><option value="667,375">Landscape phone · 667 × 375</option><option value="768,1024">Tablet · 768 × 1024</option><option value="1280,800">Laptop · 1280 × 800</option></select></label><label>Preview URL<input id="url" value="index.html"></label><button id="open">Open preview</button></header>
<div id="frame"><iframe id="preview" title="Game screen preview" src="index.html"></iframe></div>
<script>
const frame=document.getElementById('frame');
document.getElementById('size').addEventListener('change',e=>{const [w,h]=e.target.value.split(',');frame.style.width=w+'px';frame.style.height=h+'px';});
document.getElementById('open').addEventListener('click',()=>{const raw=document.getElementById('url').value;const url=new URL(raw,location.href);if(['http:','https:','file:'].includes(url.protocol))document.getElementById('preview').src=url.href;});
</script></html>
